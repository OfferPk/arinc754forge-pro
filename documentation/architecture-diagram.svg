<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="960" height="540" fill="url(#bg)"/>

  <!-- Title -->
  <text x="480" y="45" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">
    ARINC754Forge Pro (v1.0.0) Architecture &amp; FMCW Radar Pipeline
  </text>
  <text x="480" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#94a3b8">
    Low-Range Radio Altimeter (RadAlt) | ARINC 754A, RTCA DO-155 &amp; RTCA DO-399 5G Immunity
  </text>

  <!-- Block 1: Antenna & 5G C-Band Filter -->
  <g transform="translate(40, 110)" filter="url(#shadow)">
    <rect width="250" height="370" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1.5"/>
    <rect width="250" height="40" rx="8" fill="#1e293b"/>
    <text x="125" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">RADAR ANTENNAS &amp; 5G FILTER</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#cbd5e1">• TX Antenna (4.3 GHz FMCW)</text>
    <text x="20" y="105" font-family="monospace" font-size="12" fill="#cbd5e1">• RX Antenna (Reflected Return)</text>
    <text x="20" y="135" font-family="monospace" font-size="12" fill="#cbd5e1">• DO-399 5G Bandpass Filter</text>
    <text x="35" y="155" font-family="monospace" font-size="11" fill="#94a3b8">- 40 dB Rejection (3.7-3.98 GHz)</text>
    <text x="35" y="175" font-family="monospace" font-size="11" fill="#94a3b8">- FAA AD 2023-12-12 Compliant</text>
    <text x="20" y="205" font-family="monospace" font-size="12" fill="#cbd5e1">• Low Noise Amplifier (LNA)</text>
    <text x="20" y="235" font-family="monospace" font-size="12" fill="#cbd5e1">• Coaxial Feedline Delay (16 ft)</text>
    <text x="20" y="265" font-family="monospace" font-size="12" fill="#cbd5e1">• Zero Threshold Calibration</text>
    <text x="20" y="295" font-family="monospace" font-size="12" fill="#cbd5e1">• Radome Beam Shaping</text>
    <rect x="20" y="325" width="210" height="30" rx="4" fill="#042f2e" stroke="#14b8a6"/>
    <text x="125" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#2dd4bf">FAA TSO-C87b CERTIFIED</text>
  </g>

  <!-- Block 2: Transceiver Unit (RT / ARINC 754A) -->
  <g transform="translate(350, 110)" filter="url(#shadow)">
    <rect width="260" height="370" rx="8" fill="#111827" stroke="#06b6d4" stroke-width="1.5"/>
    <rect width="260" height="40" rx="8" fill="url(#cyanGrad)"/>
    <text x="130" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#041421">RADALT TRANSCEIVER (R/T)</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#e2e8f0">• Linear FMCW Synthesizer</text>
    <text x="35" y="95" font-family="monospace" font-size="11" fill="#94a3b8">- Delta F: 100 MHz (4.25-4.35 GHz)</text>
    <text x="35" y="115" font-family="monospace" font-size="11" fill="#94a3b8">- fm: 100 Hz Sweep Rate</text>
    <text x="20" y="145" font-family="monospace" font-size="12" fill="#e2e8f0">• Quadrature Mixer &amp; DSP Core</text>
    <text x="20" y="175" font-family="monospace" font-size="12" fill="#e2e8f0">• Beat Frequency FFT Analysis</text>
    <text x="35" y="195" font-family="monospace" font-size="11" fill="#94a3b8">- fb = 4 * h * DeltaF * fm / c</text>
    <text x="20" y="225" font-family="monospace" font-size="12" fill="#e2e8f0">• Altitude Rate Derivator (165)</text>
    <text x="20" y="255" font-family="monospace" font-size="12" fill="#e2e8f0">• Continuous Built-In Test (BITE)</text>
    <text x="20" y="285" font-family="monospace" font-size="12" fill="#e2e8f0">• ARINC 429 Bus Output (164/165)</text>
    <rect x="20" y="325" width="220" height="30" rx="4" fill="#172554" stroke="#3b82f6"/>
    <text x="130" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#60a5fa">DO-178C DAL-A GUIDANCE</text>
  </g>

  <!-- Block 3: Cockpit Flight Controls & Autoland -->
  <g transform="translate(670, 110)" filter="url(#shadow)">
    <rect width="250" height="370" rx="8" fill="#111827" stroke="#1f293d" stroke-width="1.5"/>
    <rect width="250" height="40" rx="8" fill="#1e293b"/>
    <text x="125" y="26" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#a855f7">AUTOLAND &amp; SAFETY FLIGHT</text>
    <text x="20" y="75" font-family="monospace" font-size="12" fill="#cbd5e1">• Autoland Flare Law (FCC)</text>
    <text x="35" y="95" font-family="monospace" font-size="11" fill="#94a3b8">- 50 ft AGL Flare Pitch Trigger</text>
    <text x="35" y="115" font-family="monospace" font-size="11" fill="#94a3b8">- 27 ft AGL Autothrottle RETARD</text>
    <text x="20" y="145" font-family="monospace" font-size="12" fill="#cbd5e1">• Primary Flight Display (PFD)</text>
    <text x="35" y="165" font-family="monospace" font-size="11" fill="#94a3b8">- Circular RadAlt Dial (0-2500')</text>
    <text x="35" y="185" font-family="monospace" font-size="11" fill="#94a3b8">- Decision Height (DH) Bug</text>
    <text x="20" y="215" font-family="monospace" font-size="12" fill="#cbd5e1">• GPWS / TAWS Mode 1 &amp; 4</text>
    <text x="35" y="235" font-family="monospace" font-size="11" fill="#94a3b8">- "Fifty, Forty, Thirty, Twenty"</text>
    <text x="20" y="265" font-family="monospace" font-size="12" fill="#cbd5e1">• TCAS II Low Altitude Inhibit</text>
    <text x="20" y="295" font-family="monospace" font-size="12" fill="#cbd5e1">• Ground Spoilers Deployment</text>
    <rect x="20" y="325" width="210" height="30" rx="4" fill="#3b0764" stroke="#a855f7"/>
    <text x="125" y="345" text-anchor="middle" font-family="monospace" font-size="11" fill="#d8b4fe">CAT-III FAIL-OPERATIONAL</text>
  </g>

  <!-- Connectors -->
  <line x1="290" y1="295" x2="350" y2="295" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4"/>
  <line x1="610" y1="295" x2="670" y2="295" stroke="#06b6d4" stroke-width="2"/>
</svg>