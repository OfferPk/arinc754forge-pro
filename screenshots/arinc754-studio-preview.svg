<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="studioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="600" fill="url(#studioBg)"/>

  <!-- Window Header -->
  <rect width="1000" height="50" fill="#111827" stroke="#1f293d" stroke-width="1"/>
  <circle cx="25" cy="25" r="6" fill="#f43f5e"/>
  <circle cx="45" cy="25" r="6" fill="#f59e0b"/>
  <circle cx="65" cy="25" r="6" fill="#10b981"/>
  <text x="100" y="31" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff">
    ARINC754Forge Pro — Radio Altimeter &amp; 5G C-Band Immunity Studio (v1.0.0)
  </text>
  <rect x="730" y="14" width="245" height="24" rx="4" fill="rgba(16,185,129,0.15)" stroke="#10b981"/>
  <text x="852" y="30" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">
    DO-399 5G TOLERANT RADALT
  </text>

  <!-- Left: Inputs & FMCW Controls -->
  <rect x="20" y="70" width="280" height="505" rx="6" fill="#111827" stroke="#1f293d"/>
  <text x="35" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">ALTIMETRY &amp; 5G CONTROLS</text>

  <rect x="35" y="120" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="142" font-family="sans-serif" font-size="12" fill="#e2e8f0">Radio Altitude: 48.0 ft AGL</text>

  <rect x="35" y="170" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="192" font-family="sans-serif" font-size="12" fill="#e2e8f0">Vertical Speed: -720 ft/min</text>

  <rect x="35" y="220" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="242" font-family="sans-serif" font-size="12" fill="#e2e8f0">5G C-Band PSD: -20 dBm/MHz</text>

  <rect x="35" y="270" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="292" font-family="sans-serif" font-size="12" fill="#e2e8f0">DO-399 Bandpass Filter: ON</text>

  <rect x="35" y="320" width="250" height="35" rx="4" fill="#0d131f" stroke="#334155"/>
  <text x="45" y="342" font-family="sans-serif" font-size="12" fill="#e2e8f0">Cable Delay: 16.0 ft (Zero Datum)</text>

  <rect x="35" y="380" width="250" height="40" rx="4" fill="#06b6d4"/>
  <text x="160" y="405" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#041421">
    EVALUATE RADALT &amp; FLARE
  </text>

  <!-- Center: Round RadAlt Dial Visualizer & Telemetry -->
  <rect x="320" y="70" width="370" height="505" rx="6" fill="#111827" stroke="#1f293d"/>
  <text x="335" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">PFD ROUND RADIO ALTIMETER DIAL</text>

  <!-- Dial Screen Box -->
  <rect x="335" y="120" width="340" height="200" rx="4" fill="#040812" stroke="#1e293b"/>
  <!-- Circular Gauge -->
  <circle cx="505" cy="220" r="75" fill="#080e1a" stroke="#1f293d" stroke-width="2"/>
  <circle cx="505" cy="220" r="75" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="60 400" transform="rotate(130 505 220)"/>
  
  <!-- Needle at 48 ft -->
  <line x1="505" y1="220" x2="455" y2="230" stroke="#f43f5e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="505" cy="220" r="4" fill="#f43f5e"/>

  <!-- Digital Box -->
  <rect x="475" y="240" width="60" height="20" rx="2" fill="#0d1527" stroke="#334155"/>
  <text x="505" y="254" text-anchor="middle" fill="#06b6d4" font-weight="bold" font-size="11" font-family="monospace">48 FT</text>

  <text x="505" y="145" text-anchor="middle" fill="#10b981" font-weight="bold" font-size="11" font-family="monospace">FLARE LAW ACTIVE (50 FT)</text>
  <text x="505" y="165" text-anchor="middle" fill="#38bdf8" font-size="10" font-family="monospace">FMCW BEAT: 2,602.8 Hz | 5G LNA: -60 dBm</text>

  <text x="335" y="350" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">ARINC 429 RADALT BUS WORDS (ATTACHMENT 2)</text>
  <rect x="335" y="370" width="340" height="185" rx="4" fill="#090e18" stroke="#1e293b"/>
  <text x="350" y="395" font-family="monospace" font-size="11" fill="#38bdf8">164 RADIO ALTITUDE : 0x6006402E (48.0 FT AGL)</text>
  <text x="350" y="425" font-family="monospace" font-size="11" fill="#38bdf8">165 ALTITUDE RATE  : 0x61FA80B6 (-720 FT/MIN)</text>
  <text x="350" y="455" font-family="monospace" font-size="11" fill="#10b981">270 RADALT STATUS  : 0x830000B8 (NORMAL_NAV)</text>
  <text x="350" y="485" font-family="monospace" font-size="11" fill="#10b981">377 EQUIP IDENT    : 0x805047FF (RADALT-1)</text>
  <text x="350" y="515" font-family="monospace" font-size="11" fill="#a855f7">5G FILTER STATUS   : 40 dB REJECTION PASS</text>

  <!-- Right: Auditor -->
  <rect x="710" y="70" width="270" height="505" rx="6" fill="#111827" stroke="#1f293d"/>
  <text x="725" y="100" font-family="sans-serif" font-size="13" font-weight="bold" fill="#94a3b8">10-POINT NORMATIVE AUDIT</text>

  <g transform="translate(725, 120)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">1. ARINC 429 Bit 32 Parity</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 160)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">2. Label Bit-Reversal</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 200)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">3. FMCW Beat Frequency</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 240)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">4. DO-399 5G 40dB Reject</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 280)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">5. Zero Runway Calibration</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 320)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">6. Autoland Flare &amp; Retard</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 360)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">7. BNR 16-Bit Scale (0.125')</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 400)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">8. Sink Rate (Label 165)</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 440)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">9. SSM Normal State (11b)</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
  <g transform="translate(725, 480)">
    <rect width="240" height="32" rx="4" fill="#090e18"/>
    <text x="10" y="20" font-family="sans-serif" font-size="11" fill="#cbd5e1">10. Boeing/Airbus Interop</text>
    <text x="210" y="20" font-family="monospace" font-size="11" font-weight="bold" fill="#10b981">PASS</text>
  </g>
</svg>